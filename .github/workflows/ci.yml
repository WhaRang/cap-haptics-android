# M2: lint + the JVM unit tests that exist precisely because they need no device —
# the §5.2 "pure logic over HapticCapabilities" constraint paying off in CI.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, lint and unit-test all modules
        run: ./gradlew build
